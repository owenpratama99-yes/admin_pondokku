name: madju_djaja
description: Madju Djaja Cafe - Employee & Manager System
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  google_fonts: ^8.1.0
  fl_chart: ^0.63.0
  intl: ^0.18.0
  shared_preferences: ^2.2.0
  go_router: ^13.2.0
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.4
  dio: ^5.4.3+1
  geolocator: ^11.0.0
  image_picker: ^1.0.7
  image_cropper: ^8.0.2
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_secure_storage: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.3.9

flutter:
  uses-material-design: true
  assets:
    - assets/images/
